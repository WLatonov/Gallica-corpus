[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gallica-parser"
version = "0.1.0"
description = "Выгрузка релевантных страниц исторической прессы из Gallica"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Research project"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gallica-parser = "gallica_parser.cli:main"
gallica-global = "gallica_parser.global_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
